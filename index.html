<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#fbfbfa">
<script>
  /* Applied before first paint, so the theme never flashes the other one.
     Light is the default; only an explicit "system" defers to the phone.
     Mirrors app/theme.js - keep the key and the bar colours in step. */
  try {
    var p = localStorage.getItem('educarlos:theme');
    var dark = p === 'dark'
      || (p === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    if (p !== 'system') document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    document.querySelector('meta[name=theme-color]')
      .setAttribute('content', dark ? '#0b0d10' : '#fbfbfa');
  } catch (e) {}
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Educarlos">
<meta name="mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light dark">
