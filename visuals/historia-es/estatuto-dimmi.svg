<svg viewBox="0 0 300 172" xmlns="http://www.w3.org/2000/svg">
  <rect class="box" x="8" y="24" width="284" height="86" rx="5"/>
  <text class="lbl" x="20" y="44" font-weight="700">Conserva</text>
  <text class="dim" x="20" y="61" font-size="10">su religión y sus lugares de culto</text>
  <text class="dim" x="20" y="75" font-size="10">sus bienes</text>
  <text class="dim" x="20" y="89" font-size="10">su propia ley y sus propias jerarquías</text>
  <text class="dim" x="20" y="103" font-size="10">protección frente a la violencia</text>

  <text class="accent" x="20" y="134" font-weight="700">A cambio</text>
  <text class="dim" x="20" y="150" font-size="10">paga una capitación, la yizya</text>
  <text class="dim" x="20" y="164" font-size="10">y queda sometido a la autoridad política</text>
</svg>
