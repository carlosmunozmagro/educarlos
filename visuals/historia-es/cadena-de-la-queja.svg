<svg viewBox="0 0 300 182" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a-que" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path class="line" d="M0 1 L9 5 L0 9 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="box" x="8" y="8" width="284" height="26" rx="4"/>
  <text class="lbl" x="18" y="25" font-size="11">Los dominicos denuncian los malos tratos</text>
  <path class="line" d="M150 36 V44" marker-end="url(#a-que)"/>

  <rect class="box" x="8" y="48" width="284" height="26" rx="4"/>
  <text class="lbl" x="18" y="65" font-size="11">1512 — junta de teólogos y juristas en Burgos</text>
  <path class="line" d="M150 76 V84" marker-end="url(#a-que)"/>

  <rect class="box" x="8" y="88" width="284" height="26" rx="4"/>
  <text class="lbl" x="18" y="105" font-size="11">27 de diciembre de 1512 — Leyes de Burgos</text>
  <path class="line" d="M150 116 V124" marker-end="url(#a-que)"/>

  <rect class="box" x="8" y="128" width="284" height="26" rx="4"/>
  <text class="lbl" x="18" y="145" font-size="11">1542 — Leyes Nuevas, tras Salamanca</text>

  <text class="accent" x="18" y="174" font-weight="700">Una queja que llega a ser ley en treinta años</text>
</svg>
