<svg viewBox="0 0 300 178" xmlns="http://www.w3.org/2000/svg">
<rect class="box" x="8.0" y="8.0" width="284.0" height="71.0" rx="4"/>
<text class="lbl" x="18.0" y="26.0" font-weight="700">Conserva</text>
<text class="dim" x="18.0" y="42.0" font-size="10">sus tierras y su dominio</text>
<text class="dim" x="18.0" y="57.0" font-size="10">su religión y sus iglesias</text>
<text class="dim" x="18.0" y="72.0" font-size="10">su vida, su libertad y su familia</text>
<rect class="box" x="8.0" y="91.0" width="284.0" height="71.0" rx="4"/>
<text class="accent" x="18.0" y="109.0" font-weight="700">Paga</text>
<text class="dim" x="18.0" y="125.0" font-size="10">1 dinar por persona y año</text>
<text class="dim" x="18.0" y="140.0" font-size="10">16 medidas de grano, mosto y vinagre</text>
<text class="dim" x="18.0" y="155.0" font-size="10">4 medidas de miel y aceite</text>
</svg>
