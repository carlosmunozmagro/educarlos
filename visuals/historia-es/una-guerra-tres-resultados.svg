<svg viewBox="0 0 300 176" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a-gue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path class="line" d="M0 1 L9 5 L0 9 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="box" x="60" y="8" width="180" height="30" rx="4"/>
  <text class="lbl" x="150" y="27" text-anchor="middle">Guerra de Sucesión</text>

  <path class="line" d="M150 40 V52 H60 V62" marker-end="url(#a-gue)"/>
  <path class="line" d="M150 40 V62" marker-end="url(#a-gue)"/>
  <path class="line" d="M150 40 V52 H240 V62" marker-end="url(#a-gue)"/>

  <rect class="box" x="8" y="66" width="96" height="56" rx="4"/>
  <text class="lbl" x="56" y="86" text-anchor="middle" font-size="11">Dinastía</text>
  <text class="dim" x="56" y="102" text-anchor="middle" font-size="10">los Borbones</text>
  <text class="dim" x="56" y="114" text-anchor="middle" font-size="10">en el trono</text>

  <rect class="box" x="110" y="66" width="80" height="56" rx="4"/>
  <text class="lbl" x="150" y="86" text-anchor="middle" font-size="11">Fuera</text>
  <text class="dim" x="150" y="102" text-anchor="middle" font-size="10">Gibraltar y</text>
  <text class="dim" x="150" y="114" text-anchor="middle" font-size="10">Menorca</text>

  <rect class="box" x="196" y="66" width="96" height="56" rx="4"/>
  <text class="accent" x="244" y="86" text-anchor="middle" font-size="11" font-weight="700">Dentro</text>
  <text class="dim" x="244" y="102" text-anchor="middle" font-size="10">un Estado</text>
  <text class="dim" x="244" y="114" text-anchor="middle" font-size="10">centralizado</text>

  <text class="dim" x="150" y="146" text-anchor="middle" font-size="10">Lo que 238 años de unión dinástica</text>
  <text class="dim" x="150" y="159" text-anchor="middle" font-size="10">no habían producido, lo produce una guerra.</text>
</svg>
