<svg viewBox="0 0 300 178" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a-car" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path class="line" d="M0 1 L9 5 L0 9 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="box" x="60" y="8" width="180" height="30" rx="4"/>
  <text class="accent" x="150" y="28" text-anchor="middle" font-weight="700">El carbón español es malo</text>

  <path class="line" d="M150 40 V52 H74 V62" marker-end="url(#a-car)"/>
  <path class="line" d="M150 40 V52 H226 V62" marker-end="url(#a-car)"/>

  <rect class="box" x="8" y="66" width="132" height="72" rx="4"/>
  <text class="lbl" x="74" y="86" text-anchor="middle" font-size="11">Cataluña</text>
  <text class="dim" x="74" y="103" text-anchor="middle" font-size="10">algodón: consume poco</text>
  <text class="dim" x="74" y="116" text-anchor="middle" font-size="10">y vende dentro, detrás</text>
  <text class="dim" x="74" y="129" text-anchor="middle" font-size="10">del arancel</text>

  <rect class="box" x="160" y="66" width="132" height="72" rx="4"/>
  <text class="lbl" x="226" y="86" text-anchor="middle" font-size="11">Vizcaya</text>
  <text class="dim" x="226" y="103" text-anchor="middle" font-size="10">hierro: exporta mineral</text>
  <text class="dim" x="226" y="116" text-anchor="middle" font-size="10">a Gran Bretaña, y con ella</text>
  <text class="dim" x="226" y="129" text-anchor="middle" font-size="10">llega el buen carbón</text>

  <text class="dim" x="150" y="160" text-anchor="middle" font-size="10">Las dos regiones que se industrializan son</text>
  <text class="dim" x="150" y="173" text-anchor="middle" font-size="10">las dos que rodean el mismo obstáculo.</text>
</svg>
