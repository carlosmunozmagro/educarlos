<svg viewBox="0 0 300 190" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="tm-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L7 4 L0 7 z" fill="currentColor"/>
    </marker>
  </defs>

  <text class="dim" x="8" y="12" font-size="10">where the tokens are</text>

  <rect class="box" x="8" y="20" width="128" height="40" rx="6"/>
  <text class="lbl" x="72" y="38" font-size="11" text-anchor="middle">wallet app</text>
  <text class="dim" x="72" y="52" font-size="10" text-anchor="middle">holds a key</text>

  <rect class="box" x="164" y="20" width="128" height="40" rx="6"/>
  <text class="lbl" x="228" y="38" font-size="11" text-anchor="middle">another wallet</text>
  <text class="dim" x="228" y="52" font-size="10" text-anchor="middle">holds a key</text>

  <line class="line" x1="72" y1="62" x2="110" y2="82" marker-end="url(#tm-arrow)"/>
  <line class="line" x1="228" y1="62" x2="190" y2="82" marker-end="url(#tm-arrow)"/>

  <rect class="box" x="30" y="88" width="240" height="84" rx="6"/>
  <text class="accent" x="150" y="105" font-size="11" text-anchor="middle">one contract</text>
  <text x="44" y="126" font-size="11">0x9f2c...</text>
  <text x="256" y="126" font-size="11" text-anchor="end">1,200</text>
  <text x="44" y="144" font-size="11">0x41ab...</text>
  <text x="256" y="144" font-size="11" text-anchor="end">85</text>
  <text class="dim" x="150" y="164" font-size="10" text-anchor="middle">a transfer edits two of these rows</text>
</svg>
