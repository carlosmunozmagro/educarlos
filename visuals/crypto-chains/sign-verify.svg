<svg viewBox="0 0 300 156" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="sv-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L7 4 L0 7 z" fill="currentColor"/>
    </marker>
  </defs>

  <text class="dim" x="8" y="12" font-size="10">who holds what, and what crosses the wire</text>

  <rect class="box" x="8" y="20" width="118" height="72" rx="6"/>
  <text class="lbl" x="18" y="38" font-size="11">Caleb, signing</text>
  <text x="18" y="55" font-size="11">d  his secret</text>
  <text x="18" y="70" font-size="11">k  fresh, once</text>
  <text x="18" y="85" font-size="11">z  the message</text>

  <rect class="box" x="174" y="20" width="118" height="72" rx="6"/>
  <text class="lbl" x="184" y="38" font-size="11">Nora, checking</text>
  <text x="184" y="55" font-size="11">Q  his public key</text>
  <text x="184" y="70" font-size="11">z  the message</text>
  <text class="dim" x="184" y="85" font-size="10">no d, ever</text>

  <line class="line" x1="128" y1="56" x2="170" y2="56" marker-end="url(#sv-arrow)"/>
  <text class="accent" x="149" y="49" font-size="12" text-anchor="middle">r, s</text>

  <rect class="box" x="8" y="104" width="284" height="44" rx="6"/>
  <text class="lbl" x="150" y="122" font-size="11" text-anchor="middle">Nora recomputes the point from r, s, z and Q</text>
  <text x="150" y="139" font-size="11" text-anchor="middle">if its x-coordinate is r, the signer knew d</text>
</svg>
