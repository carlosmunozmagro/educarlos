<svg viewBox="0 0 300 170" xmlns="http://www.w3.org/2000/svg">
  <text class="dim" x="8" y="12" font-size="10">two different messages, signed moments apart</text>
  <rect class="box" x="8" y="22" width="284" height="54" rx="6"/>
  <text class="dim" x="20" y="37" font-size="10">first signature</text>
  <rect class="hot" x="14" y="43" width="142" height="17" rx="3"/>
  <text class="lbl" x="20" y="56" font-size="11">r  d7be8435...641e</text>
  <text x="20" y="72" font-size="11">s  5c5f4ed1...68bf</text>
  <rect class="box" x="8" y="84" width="284" height="54" rx="6"/>
  <text class="dim" x="20" y="99" font-size="10">second signature</text>
  <rect class="hot" x="14" y="105" width="142" height="17" rx="3"/>
  <text class="lbl" x="20" y="118" font-size="11">r  d7be8435...641e</text>
  <text x="20" y="134" font-size="11">s  716f5b16...057f</text>
