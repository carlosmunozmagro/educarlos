<svg viewBox="0 0 300 196" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ep-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L7 4 L0 7 z" fill="currentColor"/>
    </marker>
  </defs>

  <text class="dim" x="8" y="12" font-size="10">one output, two ways to open it</text>

  <rect class="box" x="70" y="18" width="160" height="36" rx="6"/>
  <text class="lbl" x="150" y="34" font-size="12" text-anchor="middle">0.012 BTC, locked</text>
  <text class="dim" x="150" y="48" font-size="10" text-anchor="middle">nobody can move it alone</text>

  <line class="line" x1="120" y1="56" x2="80" y2="82" marker-end="url(#ep-arrow)"/>
  <line class="line" x1="180" y1="56" x2="220" y2="82" marker-end="url(#ep-arrow)"/>

  <rect class="box" x="8" y="88" width="136" height="46" rx="6"/>
  <text class="accent" x="76" y="106" font-size="11" text-anchor="middle">any 2 of 3 sign</text>
  <text class="dim" x="76" y="121" font-size="10" text-anchor="middle">Teodora, Ines, Dragan</text>

  <rect class="box" x="156" y="88" width="136" height="46" rx="6"/>
  <text class="accent" x="224" y="106" font-size="11" text-anchor="middle">30 days pass</text>
  <text class="dim" x="224" y="121" font-size="10" text-anchor="middle">Teodora signs alone</text>

  <line class="line" x1="76" y1="136" x2="76" y2="158" marker-end="url(#ep-arrow)"/>
  <line class="line" x1="224" y1="136" x2="224" y2="158" marker-end="url(#ep-arrow)"/>

  <text class="lbl" x="76" y="176" font-size="11" text-anchor="middle">Ines is paid</text>
  <text class="lbl" x="224" y="176" font-size="11" text-anchor="middle">refund</text>
  <text class="dim" x="150" y="192" font-size="10" text-anchor="middle">the script cannot tell which is fair</text>
</svg>
