<svg viewBox="0 0 300 148" xmlns="http://www.w3.org/2000/svg">
  <text class="dim" x="8" y="12" font-size="10">bar length = bits, so each row is a whole exponent, not a quantity</text>
  <text class="lbl" x="8" y="22" font-size="11">Debian OpenSSL, 2008</text>
  <rect class="hot" x="8" y="28" width="10" height="12" rx="2"/>
  <text x="190" y="38" font-size="11">2^15</text>
  <text class="dim" x="8" y="53" font-size="10">every key it could make</text>
  <text class="lbl" x="8" y="66" font-size="11">A 12-word seed phrase</text>
  <rect class="cold" x="8" y="72" width="88" height="12" rx="2"/>
  <text x="190" y="82" font-size="11">2^128</text>
  <text class="dim" x="8" y="97" font-size="10">the practical floor</text>
  <text class="lbl" x="8" y="110" font-size="11">secp256k1, as designed</text>
  <rect class="accent" x="8" y="116" width="176" height="12" rx="2"/>
  <text x="190" y="126" font-size="11">2^256</text>
  <text class="dim" x="8" y="141" font-size="10">what Nora's wallet drew from</text>
</svg>
