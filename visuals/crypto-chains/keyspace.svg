<svg viewBox="0 0 300 168" xmlns="http://www.w3.org/2000/svg">
  <text class="dim" x="8" y="12" font-size="10">bar length = bits, not quantity</text>
  <text class="lbl" x="8" y="26" font-size="11">Debian OpenSSL, 2008</text>
  <rect class="accent" x="8" y="34" width="10" height="12" rx="2"/>
  <text x="190" y="44" font-size="11">2^15</text>
  <text class="dim" x="8" y="60" font-size="10">every key it could make</text>
  <text class="lbl" x="8" y="76" font-size="11">A 12-word seed phrase</text>
  <rect class="cold" x="8" y="84" width="88" height="12" rx="2"/>
  <text x="190" y="94" font-size="11">2^128</text>
  <text class="dim" x="8" y="110" font-size="10">the practical floor</text>
  <text class="lbl" x="8" y="126" font-size="11">secp256k1, as designed</text>
  <rect class="cold" x="8" y="134" width="176" height="12" rx="2"/>
  <text x="190" y="144" font-size="11">2^256</text>
  <text class="dim" x="8" y="160" font-size="10">what Nora's wallet drew from</text>
</svg>
