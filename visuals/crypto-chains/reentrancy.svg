<svg viewBox="0 0 300 186" xmlns="http://www.w3.org/2000/svg">
  <text class="dim" x="8" y="12" font-size="10">one call, four times over, nothing written yet</text>

  <rect class="box" x="8" y="20" width="284" height="28" rx="5"/>
  <text class="lbl" x="18" y="38" font-size="11">withdraw()  balance reads 100</text>

  <rect class="box" x="24" y="54" width="268" height="28" rx="5"/>
  <text x="34" y="72" font-size="11">send 100, attacker's code runs</text>

  <rect class="box" x="40" y="88" width="252" height="28" rx="5"/>
  <text class="lbl" x="50" y="106" font-size="11">withdraw()  balance still 100</text>

  <rect class="box" x="56" y="122" width="236" height="28" rx="5"/>
  <text x="66" y="140" font-size="11">send 100, and again</text>

  <text class="accent" x="8" y="168" font-size="11">balance = 0 is the next line</text>
  <text class="dim" x="8" y="181" font-size="10">it is never reached until the money has gone</text>
</svg>
