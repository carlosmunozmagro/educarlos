<svg viewBox="0 0 300 186" xmlns="http://www.w3.org/2000/svg">
  <text class="dim" x="8" y="12" font-size="10">how the next difficulty moves</text>
  <line class="line" x1="128" y1="36" x2="128" y2="160"/>
  <text class="dim" x="8" y="34" font-size="10">2016 blocks took 10 days</text>
  <rect class="cold" x="128.0" y="39" width="19.4" height="12" rx="3"/>
  <text class="lbl" x="292" y="49" font-size="11" text-anchor="end">x1.40</text>
  <text class="dim" x="8" y="68" font-size="10">2016 blocks took 14 days</text>
  <text class="lbl" x="292" y="83" font-size="11" text-anchor="end">x1.00</text>
  <text class="dim" x="8" y="102" font-size="10">2016 blocks took 20 days</text>
  <rect class="cold" x="107.4" y="107" width="20.6" height="12" rx="3"/>
  <text class="lbl" x="292" y="117" font-size="11" text-anchor="end">x0.70</text>
  <text class="dim" x="8" y="136" font-size="10">2016 blocks took 70 days</text>
  <rect class="accent" x="48.0" y="141" width="80.0" height="12" rx="3"/>
  <text class="lbl" x="292" y="151" font-size="11" text-anchor="end">x0.25*</text>
  <text class="dim" x="128" y="170" font-size="10" text-anchor="middle">no change</text>
  <text class="accent" x="8" y="182" font-size="10">* clamped: at most a four-fold change</text>
</svg>
