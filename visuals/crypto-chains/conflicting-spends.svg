<svg viewBox="0 0 300 186" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="cs-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L7 4 L0 7 z" fill="currentColor"/>
    </marker>
  </defs>

  <text class="dim" x="8" y="12" font-size="10">one coin, two signed spends of it</text>

  <rect class="box" x="76" y="18" width="148" height="34" rx="6"/>
  <text class="lbl" x="150" y="33" font-size="11" text-anchor="middle">0.0812 BTC</text>
  <text class="dim" x="150" y="46" font-size="10" text-anchor="middle">Caleb's only coin</text>

  <line class="line" x1="130" y1="54" x2="80" y2="80" marker-end="url(#cs-arrow)"/>
  <line class="line" x1="170" y1="54" x2="220" y2="80" marker-end="url(#cs-arrow)"/>

  <rect class="box" x="8" y="86" width="136" height="44" rx="6"/>
  <text class="lbl" x="76" y="103" font-size="11" text-anchor="middle">to Nora</text>
  <text x="76" y="118" font-size="11" text-anchor="middle">0.05 BTC</text>

  <rect class="box" x="156" y="86" width="136" height="44" rx="6"/>
  <text class="lbl" x="224" y="103" font-size="11" text-anchor="middle">to himself</text>
  <text x="224" y="118" font-size="11" text-anchor="middle">0.0809 BTC</text>

  <text class="dim" x="76" y="146" font-size="10" text-anchor="middle">Lisbon sees this first</text>
  <text class="dim" x="224" y="146" font-size="10" text-anchor="middle">Toronto sees this first</text>

  <text class="accent" x="150" y="172" font-size="12" text-anchor="middle">both verify perfectly</text>
</svg>
