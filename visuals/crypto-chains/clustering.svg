<svg viewBox="0 0 300 178" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="cl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L7 4 L0 7 z" fill="currentColor"/>
    </marker>
  </defs>

  <text class="dim" x="8" y="12" font-size="10">what one transaction tells a stranger</text>

  <rect class="accent" x="8" y="24" width="80" height="20" rx="4"/>
  <text x="48" y="38" font-size="10" text-anchor="middle">0.006</text>
  <rect class="accent" x="8" y="50" width="80" height="20" rx="4"/>
  <text x="48" y="64" font-size="10" text-anchor="middle">0.004</text>
  <rect class="accent" x="8" y="76" width="80" height="20" rx="4"/>
  <text x="48" y="90" font-size="10" text-anchor="middle">0.003</text>
  <text class="accent" x="8" y="112" font-size="11">all three: one owner</text>

  <line class="line" x1="90" y1="60" x2="118" y2="60" marker-end="url(#cl-arrow)"/>

  <rect class="box" x="120" y="40" width="52" height="40" rx="5"/>
  <text class="dim" x="146" y="64" font-size="10" text-anchor="middle">spend</text>

  <line class="line" x1="174" y1="52" x2="200" y2="40" marker-end="url(#cl-arrow)"/>
  <line class="line" x1="174" y1="68" x2="200" y2="84" marker-end="url(#cl-arrow)"/>

  <rect class="box" x="204" y="24" width="88" height="26" rx="4"/>
  <text x="248" y="41" font-size="10" text-anchor="middle">0.012 to Ines</text>

  <rect class="cold" x="204" y="72" width="88" height="26" rx="4"/>
  <text x="248" y="89" font-size="10" text-anchor="middle">0.0009 back</text>
  <text class="dim" x="248" y="112" font-size="10" text-anchor="middle">the odd amount</text>
  <text class="dim" x="248" y="125" font-size="10" text-anchor="middle">is the change</text>

  <text class="lbl" x="150" y="150" font-size="11" text-anchor="middle">two guesses, and both are usually right</text>
  <text class="dim" x="150" y="166" font-size="10" text-anchor="middle">repeat across every payment she ever makes</text>
</svg>
