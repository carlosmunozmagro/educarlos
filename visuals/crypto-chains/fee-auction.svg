<svg viewBox="0 0 300 178" xmlns="http://www.w3.org/2000/svg">
  <text class="dim" x="8" y="12" font-size="10">sorted by fee rate, packed until full</text>
  <rect class="cold" x="8" y="24" width="284" height="20" rx="4"/>
  <text class="lbl" x="16" y="38" font-size="11">a courier</text>
  <text class="lbl" x="284" y="38" font-size="11" text-anchor="end">30 sat/vB</text>
  <rect class="cold" x="8" y="50" width="284" height="20" rx="4"/>
  <text class="lbl" x="16" y="64" font-size="11">a refund</text>
  <text class="lbl" x="284" y="64" font-size="11" text-anchor="end">25 sat/vB</text>
  <rect class="cold" x="8" y="76" width="284" height="20" rx="4"/>
  <text class="lbl" x="16" y="90" font-size="11">a pressing deposit</text>
  <text class="lbl" x="284" y="90" font-size="11" text-anchor="end">18 sat/vB</text>
  <rect class="box" x="8" y="102" width="284" height="20" rx="4"/>
  <text class="accent" x="16" y="116" font-size="11">Teodora, 41 inputs</text>
  <text class="accent" x="284" y="116" font-size="11" text-anchor="end">10 sat/vB  too big</text>
  <rect class="cold" x="8" y="128" width="284" height="20" rx="4"/>
  <text class="lbl" x="16" y="142" font-size="11">a coffee</text>
  <text class="lbl" x="284" y="142" font-size="11" text-anchor="end">8 sat/vB</text>
  <text class="dim" x="8" y="172" font-size="10">the 14,000 sat transaction is the one left out</text>
</svg>
