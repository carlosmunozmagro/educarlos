  <rect class="hot" x="8" y="36" width="88" height="34" rx="5"/>
  <text x="52" y="52" font-size="10" text-anchor="middle">inputs</text>
  <text x="52" y="64" font-size="10" text-anchor="middle">signed</text>
  <rect class="hot" x="8" y="76" width="88" height="34" rx="5"/>
  <text x="52" y="92" font-size="10" text-anchor="middle">outputs</text>
  <text x="52" y="104" font-size="10" text-anchor="middle">signed</text>
  <text class="dim" x="52" y="126" font-size="10" text-anchor="middle">the default</text>

  <text class="lbl" x="150" y="30" font-size="11" text-anchor="middle">NONE</text>
  <rect class="hot" x="106" y="36" width="88" height="34" rx="5"/>
  <text x="150" y="52" font-size="10" text-anchor="middle">inputs</text>
  <text x="150" y="64" font-size="10" text-anchor="middle">signed</text>
  <rect class="box" x="106" y="76" width="88" height="34" rx="5"/>
  <text class="accent" x="150" y="92" font-size="10" text-anchor="middle">outputs</text>
  <text class="accent" x="150" y="104" font-size="10" text-anchor="middle">open</text>
  <text class="dim" x="150" y="126" font-size="10" text-anchor="middle">a blank cheque</text>

  <text class="lbl" x="248" y="30" font-size="11" text-anchor="middle">SINGLE</text>
