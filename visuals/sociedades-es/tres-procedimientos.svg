<svg viewBox="0 0 300 172" xmlns="http://www.w3.org/2000/svg">
<text class="dim" x="6" y="13" font-size="10">No todo lo que llega de Hacienda es una inspección</text>
<rect class="cold" x="6" y="22" width="120" height="30" rx="3"/>
<text class="lbl" x="14" y="35" font-size="11">Verificación</text>
<text class="dim" x="14" y="47" font-size="10">errores en lo declarado</text>
<rect class="cold" x="6" y="60" width="196" height="30" rx="3"/>
<text class="lbl" x="14" y="73" font-size="11">Comprobación limitada</text>
<text class="dim" x="14" y="85" font-size="10">pide papeles nuevos — arts. 136-140</text>
<rect class="hot" x="6" y="98" width="288" height="30" rx="3"/>
<text class="lbl" x="14" y="111" font-size="11">Inspección</text>
<text class="dim" x="14" y="123" font-size="10">18 meses, o 27 — art. 150</text>
<text class="accent" x="6" y="148" font-size="11" font-weight="700">Pasarse del plazo no caduca nada.</text>
<text class="dim" x="6" y="164" font-size="10">Sólo deja de interrumpir la prescripción.</text>
</svg>
