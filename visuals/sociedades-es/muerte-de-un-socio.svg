<path class="line" d="M116 34 L64 54" marker-end="url(#ms-arrow)"/>
<path class="line" d="M184 34 L236 54" marker-end="url(#ms-arrow)"/>
<text class="dim" x="14" y="50" font-size="10">por defecto</text>
