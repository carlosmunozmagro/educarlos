<svg viewBox="0 0 300 166" xmlns="http://www.w3.org/2000/svg">
<text class="dim" x="6.0" y="14" font-size="10">La rama que se escinde vale 1.200.000 €</text>
<rect class="cold" x="6.0" y="22" width="288.0" height="28" rx="3"/>
<rect class="hot" x="6.0" y="22" width="96.0" height="28" rx="3"/>
<text class="lbl" x="14" y="41" font-size="11">400.000 €</text>
<text class="dim" x="110" y="41" font-size="10">plusvalía latente 800.000 €</text>
<text class="dim" x="6.0" y="70" font-size="10">valor fiscal, que es el que viaja</text>
<text class="lbl" x="6.0" y="98" font-size="11">Hoy no se tributa: 160.000 € aplazados</text>
<text class="dim" x="6.0" y="114" font-size="10">al 20% sobre la plusvalía latente</text>
<text class="accent" x="6.0" y="140" font-size="11" font-weight="700">Y sólo si hay motivo económico válido</text>
<text class="dim" x="6.0" y="156" font-size="10">art. 89.2 — se juzga después, no antes</text>
</svg>
