<text class="lbl" x="14" y="39" font-size="11">y colegiación obligatoria?</text>
<path class="line" d="M78 44 L54 66" marker-end="url(#sp-arrow)"/>
<path class="line" d="M222 44 L246 66" marker-end="url(#sp-arrow)"/>
<text class="dim" x="60" y="60" font-size="10">sí</text>
