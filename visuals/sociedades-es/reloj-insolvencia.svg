<svg viewBox="0 0 300 150" xmlns="http://www.w3.org/2000/svg">
<text class="dim" x="6" y="13" font-size="10">15 de marzo: Ámbar sabe que no puede pagar</text>
<text class="lbl" x="6" y="38" font-size="11">Deber</text>
<line class="line" x1="34.0" y1="46" x2="106.6" y2="46" stroke-width="6"/>
<text class="accent" x="111.6" y="50" font-size="10" font-weight="700">15 may</text>
<text class="dim" x="34" y="64" font-size="10">dos meses para pedir el concurso — art. 5</text>
<text class="lbl" x="6" y="90" font-size="11">Escudo</text>
<line class="line" x1="34.0" y1="98" x2="142.9" y2="98" stroke-width="6"/>
<line class="line" x1="142.9" y1="98" x2="251.7" y2="98" stroke-width="6" stroke-dasharray="3 3"/>
<text class="accent" x="211.7" y="114" font-size="10" font-weight="700">15 oct</text>
<text class="dim" x="34" y="128" font-size="10">3 meses + 3 de prórroga, y un mes más</text>
<text class="dim" x="6" y="144" font-size="10">El escudo no borra el deber: lo aplaza.</text>
</svg>
