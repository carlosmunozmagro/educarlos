<svg viewBox="0 0 300 176" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="pe-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
<path d="M0 0 L8 4 L0 8 z" fill="currentColor"/>
</marker>
</defs>
<rect class="box" x="6" y="22" width="134" height="96" rx="4"/>
<text class="lbl" x="16" y="40" font-size="11">Pacto de socios</text>
<text class="dim" x="16" y="14" font-size="10">privado</text>
<text x="16" y="58" font-size="11">Obliga a quien firma</text>
<text x="16" y="76" font-size="11">Nadie más lo ve</text>
<text x="16" y="94" font-size="11">Se incumple:</text>
<text class="dim" x="16" y="110" font-size="10">se indemniza</text>
<rect class="box" x="160" y="22" width="134" height="96" rx="4"/>
<text class="lbl" x="170" y="40" font-size="11">Estatutos</text>
<text class="dim" x="170" y="14" font-size="10">inscritos</text>
<text x="170" y="58" font-size="11">Obligan a la sociedad</text>
<text x="170" y="76" font-size="11">Públicos en el Registro</text>
<text x="170" y="94" font-size="11">Se incumple:</text>
<text class="accent" x="170" y="110" font-size="10" font-weight="700">se excluye (art. 350)</text>
<path class="line" d="M140 70 L156 70" marker-end="url(#pe-arrow)"/>
<text class="dim" x="6" y="140" font-size="10">La única puerta entre los dos:</text>
<text class="accent" x="6" y="156" font-size="11" font-weight="700">prestaciones accesorias — art. 86</text>
<text class="dim" x="6" y="170" font-size="10">contenido concreto, en estatutos, fuera del capital</text>
</svg>
