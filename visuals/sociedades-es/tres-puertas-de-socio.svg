<svg viewBox="0 0 300 168" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="ps-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
<path d="M0 0 L8 4 L0 8 z" fill="currentColor"/>
</marker>
</defs>
<text class="dim" x="6" y="14" font-size="10">Has pagado y has firmado. Todavía no basta.</text>
<rect class="box" x="6" y="22" width="288" height="30" rx="3"/>
<text x="14" y="41" font-size="11">1 · En documento público — art. 106</text>
<path class="line" d="M150 52 L150 60" marker-end="url(#ps-arrow)"/>
<rect class="box" x="6" y="64" width="288" height="30" rx="3"/>
<text x="14" y="83" font-size="11">2 · La sociedad lo sabe — art. 106</text>
<path class="line" d="M150 94 L150 102" marker-end="url(#ps-arrow)"/>
<rect class="hot" x="6" y="106" width="288" height="30" rx="3"/>
<text class="lbl" x="14" y="125" font-size="11">3 · Inscrito en el libro — art. 104</text>
<text class="accent" x="6" y="152" font-size="11" font-weight="700">Sólo es socio quien está en el libro.</text>
<text class="dim" x="6" y="164" font-size="10">Y el libro lo guarda el administrador.</text>
</svg>
