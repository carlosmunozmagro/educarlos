<path d="M0 0 L8 4 L0 8 z" fill="currentColor"/>
</marker>
</defs>
<rect class="hot" x="82" y="10" width="136" height="26" rx="3"/>
<text class="lbl" x="92" y="27" font-size="11">66.000 € salen a Diego</text>
<path class="line" d="M112 36 L64 62" marker-end="url(#df-arrow)"/>
<path class="line" d="M188 36 L236 62" marker-end="url(#df-arrow)"/>
<rect class="box" x="6" y="66" width="136" height="72" rx="3"/>
<text class="dim" x="14" y="82" font-size="10">Sin reserva del 332</text>
<text class="lbl" x="14" y="100" font-size="11">Responde Diego</text>
<text x="14" y="116" font-size="11">hasta 66.000 €</text>
<text class="accent" x="14" y="131" font-size="11" font-weight="700">cinco años</text>
<rect class="box" x="158" y="66" width="136" height="72" rx="3"/>
<text class="dim" x="166" y="82" font-size="10">Con reserva del 332</text>
<text class="lbl" x="166" y="100" font-size="11">Responde Ámbar</text>
<text x="166" y="116" font-size="11">66.000 € bloqueados</text>
