<svg viewBox="0 0 300 138" xmlns="http://www.w3.org/2000/svg">
  <rect class="box" x="6" y="10" width="134" height="50" rx="8"/>
  <text class="lbl" x="18" y="30">Vender</text>
  <text class="dim" x="18" y="45" font-size="10">persona: base del ahorro</text>
  <text class="dim" x="18" y="56" font-size="10">sociedad: art. 21</text>

  <rect class="box" x="160" y="10" width="134" height="50" rx="8"/>
  <text class="lbl" x="172" y="30">Liquidar</text>
  <text class="dim" x="172" y="45" font-size="10">pagar acreedores y</text>
  <text class="dim" x="172" y="56" font-size="10">repartir la cuota</text>

  <path class="line" d="M6 74 H294" opacity=".5"/>

  <text class="accent" x="6" y="92" font-weight="700">Lo que sobrevive</text>
  <text class="dim" x="6" y="108" font-size="10">Socios: hasta su cuota de liquidación (art. 399)</text>
  <text class="dim" x="6" y="122" font-size="10">Administradores: art. 43.1.b) LGT</text>
  <text class="dim" x="6" y="134" font-size="10">Y los liquidadores, por su cuenta</text>
</svg>
