<svg viewBox="0 0 300 174" xmlns="http://www.w3.org/2000/svg">
<text class="dim" x="6" y="14" font-size="10">Diego quiere salir de Ámbar</text>
<rect class="box" x="6" y="22" width="288" height="38" rx="3"/>
<text class="lbl" x="14" y="39" font-size="11">Vender</text>
<text class="dim" x="14" y="53" font-size="10">necesita comprador y el permiso de los estatutos</text>
<rect class="box" x="6" y="66" width="288" height="38" rx="3"/>
<text class="lbl" x="14" y="83" font-size="11">Separarse</text>
<text class="dim" x="14" y="97" font-size="10">sólo con causa: art. 346, o dividendos del 348 bis</text>
<rect class="box" x="6" y="110" width="288" height="38" rx="3"/>
<text class="lbl" x="14" y="127" font-size="11">Ser excluido</text>
<text class="dim" x="14" y="141" font-size="10">sólo con causa del art. 350, y lo decide la sociedad</text>
<text class="accent" x="6" y="166" font-size="11" font-weight="700">Enfadarse no está en la lista.</text>
</svg>
