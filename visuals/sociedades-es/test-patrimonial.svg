<svg viewBox="0 0 300 126" xmlns="http://www.w3.org/2000/svg">
  <path class="line" d="M14 18 V104"/>

  <circle class="box" cx="14" cy="20" r="5"/>
  <text class="lbl" x="28" y="18">¿Ordenas medios o personas?</text>
  <text class="dim" x="28" y="32" font-size="10">art. 5.1</text>

  <circle class="box" cx="14" cy="62" r="5"/>
  <text class="lbl" x="28" y="60">Si es arrendamiento:</text>
  <text class="dim" x="28" y="74" font-size="10">una persona, contrato laboral, jornada completa</text>

  <circle class="hot" cx="14" cy="104" r="5"/>
  <text class="accent" x="28" y="102" font-weight="700">Si no, entidad patrimonial</text>
  <text class="dim" x="28" y="116" font-size="10">media de los balances trimestrales, art. 5.2</text>
</svg>
