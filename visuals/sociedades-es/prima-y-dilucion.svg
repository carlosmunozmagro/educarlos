<svg viewBox="0 0 300 152" xmlns="http://www.w3.org/2000/svg">
<text class="dim" x="6.0" y="14" font-size="10">Vega pone 500.000 € por el 20%</text>
<rect class="cold" x="6.0" y="22" width="288.0" height="26" rx="3"/>
<rect class="hot" x="6.0" y="22" width="8.6" height="26" rx="3"/>
<text class="lbl" x="20" y="39" font-size="11">Prima de emisión — 485.000 €</text>
<text class="accent" x="6.0" y="62" font-size="11" font-weight="700">Al capital sólo van 15.000 €</text>
<text class="dim" x="6.0" y="76" font-size="10">el 3% de lo que entra</text>
<text class="dim" x="6.0" y="98" font-size="10">Y los de siempre bajan:</text>
<text x="6" y="114" font-size="11">Álvaro  45% → 36%</text>
<text x="6" y="129" font-size="11">Rosa  35% → 28%</text>
<text x="6" y="144" font-size="11">Kenji  20% → 16%</text>
</svg>
